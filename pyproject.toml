[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urllib3-knowledge-crawler"
version = "0.1.0"
description = "Build version-aware urllib3 security knowledge for AI-assisted SAST."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
  "packaging>=24,<26",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "tenacity>=8.2,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
urllib3-kb = "crawler.cli:app"

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.setuptools.package-data]
crawler = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "slow: isolated venv editable-install smoke (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".agents", ".flow", "flow"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["crawler"]
exclude = ["^build/"]
pretty = true
show_error_codes = true
warn_unreachable = true
